<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network Core Performance Simulator</title><style>
:root{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;color:#eef3ff;background:#090f20}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#1d2451,transparent 40%),#090f20}.wrap{max-width:1300px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;gap:14px;align-items:center}.logo{background:linear-gradient(135deg,#4077ed,#9c5cf2);border-radius:16px;padding:14px;font-size:26px}h1{font-size:clamp(21px,3vw,30px);margin:0}h2{font-size:19px;margin:0 0 18px}.muted{color:#aeb9d9;font-size:14px;margin-top:5px}.layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:20px}.nav,.panel{background:#131d36;border:1px solid #2a3659;border-radius:18px}.nav{padding:12px;align-self:start;display:grid;gap:7px}.nav button,.lang,.primary,.secondary{border:0;border-radius:11px;cursor:pointer;font:inherit;padding:13px 15px;color:#dbe6ff}.nav button{text-align:start;background:transparent}.nav button.active,.nav button:hover{background:#344778;color:white}.lang,.secondary{background:#29385c}.primary{background:linear-gradient(100deg,#256ee9,#8757e9);font-weight:700}.main{min-width:0}.panel{padding:22px;margin-bottom:18px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.controls label{display:grid;gap:7px;color:#c7d5f1;font-size:13px}.controls input{background:#0c152a;border:1px solid #3c4d76;border-radius:10px;color:#fff;padding:12px;font:inherit;width:100%;min-width:0}.controls input:focus{outline:2px solid #8d9aff}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.error{color:#ff9eaa;margin-top:10px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#0c162e;border:1px solid #334266;border-radius:13px;padding:17px;min-width:0}.card .label{color:#b8c9eb;font-size:13px}.card .value{font-size:clamp(17px,2vw,24px);font-weight:750;margin-top:9px;overflow-wrap:anywhere}.chartbox{background:#f7faff;border-radius:13px;padding:12px;overflow-x:auto;color:#1a3151}.chartbox svg{display:block;width:100%;min-width:430px;max-height:350px}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:690px;font-size:13px}.table th,.table td{padding:12px;border-bottom:1px solid #344364;text-align:center}.table th{color:#c6d9ff;background:#1b2b4b}.small{font-size:13px;color:#b8c8e9;line-height:1.8}.note{background:#19243e;border:1px solid #34456c;border-radius:13px;padding:17px;margin-bottom:20px}.badge{color:#9be4cb;background:#173d42;padding:6px 10px;border-radius:30px;font-size:12px}.hidden{display:none!important}.statline{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:13px;color:#d2dfff}.rangehead{display:flex;justify-content:space-between;gap:8px}.hint{margin:10px 0 0;color:#aebfdd;font-size:13px}.chartpair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chartpair .chartbox svg{min-width:300px}@media(max-width:900px){.layout{grid-template-columns:1fr}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.chartpair{grid-template-columns:1fr}}@media(max-width:500px){.wrap{padding:12px}.panel{padding:15px}.controls{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.card{padding:12px}.card .value{font-size:18px}header{align-items:flex-start}.lang{padding:10px}.chartpair .chartbox svg{min-width:430px}}
</style></head><body><div class="wrap"><header><div class="brand"><div class="logo">🌐</div><div><h1>Network Core Performance Simulator</h1><div class="muted" data-i="subtitle"></div></div></div><button class="lang" id="lang">English 🌍</button></header><div class="layout"><nav class="nav"><button class="active" data-page="all" data-i="dashboard"></button><button data-page="topology" data-i="topology"></button><button data-page="delay" data-i="delays"></button><button data-page="packets" data-i="packets"></button><button data-page="compare" data-i="compare"></button></nav><main class="main"><section class="panel"><h2 data-i="settings"></h2><div class="controls"><label><span data-i="packet"></span><input id="packet" type="number" min="1" max="100000" value="1500"></label><label><span data-i="link1"></span><input id="link1" type="number" min="0.01" max="100000" value="10" step="any"></label><label><span data-i="link2"></span><input id="link2" type="number" min="0.01" max="100000" value="2" step="any"></label><label><span data-i="link3"></span><input id="link3" type="number" min="0.01" max="100000" value="100" step="any"></label><label><span data-i="distance"></span><input id="distance" type="number" min="0" max="100000" value="1000" step="any"></label><label><span class="rangehead"><span data-i="traffic"></span><strong id="trafficVal">50%</strong></span><input id="traffic" type="range" min="0" max="150" value="50"></label><label><span class="rangehead"><span data-i="buffer"></span><strong id="bufferVal">20</strong></span><input id="buffer" type="range" min="1" max="100" value="20"></label><label><span data-i="users"></span><input id="users" type="number" min="1" max="10000" value="40"></label><label><span data-i="userRate"></span><input id="userRate" type="number" min="0.01" max="10000" step="any" value="0.1"></label></div><div class="actions"><button class="primary" id="run" data-i="run"></button><button class="secondary" id="reset" data-i="reset"></button></div><div class="error" id="error" role="alert"></div></section><section class="panel"><h2 data-i="results"></h2><div class="cards" id="cards"></div></section><section class="panel" id="topologySection"><h2 data-i="topologyTitle"></h2><div class="chartbox" id="topologyChart"></div></section><section class="panel" id="delaySection"><h2 data-i="delayTitle"></h2><div class="tablewrap"><table class="table"><thead id="delayHead"></thead><tbody id="delayRows"></tbody></table></div><p class="hint" data-i="delayHint"></p><div class="chartbox" id="delayChart"></div></section><section class="panel" id="packetsSection"><h2 data-i="packetsTitle"></h2><div class="statline" id="packetStats"></div><div class="chartbox" id="packetsChart"></div><h2 style="margin-top:22px" data-i="intensityTitle"></h2><div class="chartpair"><div class="chartbox" id="lossCurve"></div><div class="chartbox" id="delayCurve"></div></div></section><section class="panel" id="compareSection"><h2 data-i="compareTitle"></h2><div class="cards" id="compareCards"></div><p class="small" data-i="compareHint"></p><div class="chartbox" id="compareChart"></div></section><section class="note small" data-i="assumptions"></section></main></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const dict={ar:{subtitle:'محاكاة تفاعلية للتأخير وفقدان الحزم ومعدل النقل',dashboard:'⌂ لوحة التحكم',topology:'🌐 رسم الشبكة',delays:'⚡ التأخير',packets:'📦 فقدان الحزم',compare:'📊 المقارنة',settings:'⚙ إعدادات الشبكة',packet:'حجم الحزمة (بايت)',link1:'سرعة الوصلة 1 (Mbps)',link2:'سرعة الوصلة 2 (Mbps)',link3:'سرعة الوصلة 3 (Mbps)',distance:'المسافة لكل وصلة (كم)',traffic:'شدة الحركة (% من سعة أبطأ وصلة)',buffer:'سعة المخزن (حزمة)',users:'عدد المستخدمين المطلوب',userRate:'حصة المستخدم في الدارة (Mbps)',run:'▶ تشغيل المحاكاة',reset:'↻ استعادة المثال',results:'نتائج المحاكاة',topologyTitle:'🌐 المسار: المرسل ← الموجهات ← المستقبل',delayTitle:'⚡ حساب التأخير لكل وصلة',delayHint:'يُحسب تأخير الإرسال L/R والانتشار d/s لكل وصلة، وتُضاف المعالجة والانتظار عند الموجهات فقط.',packetsTitle:'📦 محاكاة مخزن الموجه',intensityTitle:'📈 التأخير والفقد مقابل شدة الحركة',compareTitle:'📊 مقارنة تحويل الدارات وتحويل الحزم',compareHint:'تحويل الدارات: عدد المستخدمين الذين يمكن حجز حصتهم كاملة على أبطأ وصلة. تحويل الحزم: عدد المستخدمين الذين يمكنهم مشاركة الوصلة بافتراض أن كل مستخدم نشط 10% من الوقت (تقدير إحصائي، وليس ضماناً).',assumptions:'نموذج تعليمى بثلاث وصلات وموجهين وسيطين. سرعة الانتشار 200,000 كم/ثانية، وتأخير المعالجة 0.5 ms لكل موجه. نموذج الانتظار M/M/1 التقريبى يُستخدم عندما تكون شدة الحركة أقل من 100%، ولا يمثل توزيع تأخير دقيقاً عند التشبع. فقدان الحزم يُحاكى بطابور محدود باستخدام وصول بواسون وخدمة عشوائية. النتائج تقديرية وليست قياسات لشبكة فعلية.',total:'التأخير الكلى',throughput:'معدل النقل الأقصى',loss:'فقدان الحزم',bottleneck:'أبطأ وصلة',arrivals:'الحزم الواردة',dropped:'الحزم المفقودة',delivered:'الحزم المنقولة',tx:'الإرسال',prop:'الانتشار',proc:'المعالجة',queue:'الانتظار',hop:'الوصلة',rate:'السرعة',sum:'المجموع',sender:'المرسل',receiver:'المستقبل',router:'موجه',intensity:'شدة الحركة (La/R)',lossAxis:'فقدان الحزم (%)',delayAxis:'التأخير (ms)',time:'الخطوة الزمنية',occupancy:'الحزم في المخزن',circuit:'تحويل الدارات',packetSwitch:'تحويل الحزم',supported:'مستخدمون مدعومون',requested:'مستخدمون مطلوبون',invalid:'تحققى من المدخلات: يجب أن تكون القيم ضمن الحدود الظاهرة.',ms:'مللى ثانية'},en:{subtitle:'Interactive delay, loss and throughput simulation',dashboard:'⌂ Dashboard',topology:'🌐 Topology',delays:'⚡ Delays',packets:'📦 Packet loss',compare:'📊 Comparison',settings:'⚙ Network settings',packet:'Packet size (bytes)',link1:'Link 1 rate (Mbps)',link2:'Link 2 rate (Mbps)',link3:'Link 3 rate (Mbps)',distance:'Distance per link (km)',traffic:'Traffic intensity (% of bottleneck capacity)',buffer:'Router buffer capacity (packets)',users:'Requested users',userRate:'Reserved circuit rate per user (Mbps)',run:'▶ Run simulation',reset:'↻ Restore example',results:'Simulation results',topologyTitle:'🌐 Path: sender → routers → receiver',delayTitle:'⚡ Per-hop delay calculation',delayHint:'Transmission L/R and propagation d/s are calculated per link; processing and queueing are added at intermediate routers only.',packetsTitle:'📦 Router buffer simulation',intensityTitle:'📈 Delay and loss versus traffic intensity',compareTitle:'📊 Circuit versus packet switching',compareHint:'Circuit switching: users with guaranteed reserved rate on the bottleneck link. Packet switching: users statistically sharing the link assuming each is active 10% of the time (estimate, not a guarantee).',assumptions:'Educational model with three links and two intermediate routers. Propagation speed 200,000 km/s; processing 0.5 ms per router. Approximate M/M/1 queueing delay applies below 100% intensity and is not a precise model at saturation. Packet loss uses a finite queue with Poisson arrivals and random service. Results are estimates, not measurements of a live network.',total:'Total delay',throughput:'Bottleneck throughput',loss:'Packet loss',bottleneck:'Bottleneck link',arrivals:'Arrivals',dropped:'Dropped',delivered:'Delivered',tx:'Transmission',prop:'Propagation',proc:'Processing',queue:'Queueing',hop:'Link',rate:'Rate',sum:'Total',sender:'Sender',receiver:'Receiver',router:'Router',intensity:'Traffic intensity (La/R)',lossAxis:'Packet loss (%)',delayAxis:'Delay (ms)',time:'Time step',occupancy:'Buffered packets',circuit:'Circuit switching',packetSwitch:'Packet switching',supported:'Supported users',requested:'Requested users',invalid:'Check inputs: all values must be within the displayed limits.',ms:'milliseconds'}};let lang='ar',page='all',data=null;const txt=k=>dict[lang][k];function svg(body,w=800,h=290){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img">${body}</svg>`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function random(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}function poisson(lambda,rng){let l=Math.exp(-Math.min(lambda,30)),k=0,p=1;do{k++;p*=rng()}while(p>l&&k<100);return k-1}function queueSim(rho,cap,seed=23,steps=2400){const r=random(seed),service=4,lambda=rho*service;let n=0,arr=0,drop=0,h=[];for(let i=0;i<steps;i++){let incoming=poisson(lambda,r);arr+=incoming;let accepted=Math.min(incoming,Math.max(0,cap-n));drop+=incoming-accepted;n+=accepted;let out=poisson(service,r);n=Math.max(0,n-out);h.push(n)}return{arr,drop,loss:arr?100*drop/arr:0,h}}function queueMs(rho,rate,bytes){let serviceMs=bytes*8/(rate*1e6)*1000;return rho>=1?null:serviceMs*rho/(1-rho)}function calc(){const ids=['packet','link1','link2','link3','distance','traffic','buffer','users','userRate'],v={};for(const id of ids){const el=$(id),num=Number(el.value);if(el.value.trim()===''||!Number.isFinite(num)||num<Number(el.min)||num>Number(el.max)||(['packet','buffer','users'].includes(id)&&!Number.isInteger(num))){$('error').textContent=txt('invalid');return}v[id]=num}$('error').textContent='';const rates=[v.link1,v.link2,v.link3],bottleneck=Math.min(...rates),rho=v.traffic/100,trans=rates.map(r=>v.packet*8/(r*1e6)*1000),prop=v.distance/200,proc=.5,wait=queueMs(rho,bottleneck,v.packet),per=rates.map((rate,i)=>({rate,tx:trans[i],prop,proc:i<2?proc:0,queue:i<2?wait:0}));const fixed=per.reduce((s,x)=>s+x.tx+x.prop+x.proc,0),total=wait===null?null:fixed+2*wait;const sim=queueSim(rho,v.buffer);const circuit=Math.floor(bottleneck/v.userRate),packet=Math.floor(bottleneck/(v.userRate*.1));data={v,rates,bottleneck,rho,per,total,fixed,sim,circuit,packet};render()}function card(a,b){return `<div class="card"><div class="label">${esc(a)}</div><div class="value" dir="ltr">${esc(b)}</div></div>`}function bars(labels,values,unit=''){const max=Math.max(...values,1)*1.18;let out='<line x1="50" y1="246" x2="760" y2="246" stroke="#9baecb"/>';values.forEach((v,i)=>{const slot=670/values.length,bw=Math.min(105,slot*.6),x=65+i*slot+(slot-bw)/2,h=195*v/max;out+=`<rect x="${x}" y="${246-h}" width="${bw}" height="${h}" rx="7" fill="${i%2?'#8058d9':'#217fdd'}"/><text x="${x+bw/2}" y="${235-h}" text-anchor="middle" font-size="14" font-weight="bold" fill="#203450">${Number(v).toFixed(v<10?2:0)}${unit}</text><text x="${x+bw/2}" y="275" text-anchor="middle" font-size="${labels.length>4?11:13}" fill="#203450">${esc(labels[i])}</text>`});return svg(out)}function topology(){let out='';for(let i=0;i<4;i++){let x=95+i*200;if(i<3){out+=`<line x1="${x+36}" y1="105" x2="${x+164}" y2="105" stroke="#16a6c8" stroke-width="4"/><path d="M${x+154} 97 L${x+166} 105 L${x+154} 113" fill="none" stroke="#16a6c8" stroke-width="3"/><text x="${x+100}" y="87" text-anchor="middle" font-size="14" fill="#1c476d">${data.rates[i]} Mbps</text>`}out+=`<circle cx="${x}" cy="105" r="33" fill="${i===0||i===3?'#1479e8':'#7d54d9'}"/><text x="${x}" y="112" text-anchor="middle" font-size="21" fill="white">${i+1}</text><text x="${x}" y="167" text-anchor="middle" font-size="14" fill="#1d3755">${esc(i===0?txt('sender'):i===3?txt('receiver'):txt('router')+' '+i)}</text>`}return svg(out,800,210)}function curve(title,values,maxY,yUnit,xLabel){const left=70,top=30,w=660,h=195,mx=Math.max(maxY,1),points=values.map((v,i)=>`${left+i*w/(values.length-1)},${top+h-Math.min(mx,v)/mx*h}`).join(' ');let out='';for(let i=0;i<=4;i++){let y=top+i*h/4;out+=`<line x1="${left}" y1="${y}" x2="${left+w}" y2="${y}" stroke="#dbe3f0"/><text x="60" y="${y+4}" font-size="12" text-anchor="end" fill="#314665">${(mx*(1-i/4)).toFixed(0)}</text>`}out+=`<polyline points="${points}" stroke="#1c83e6" stroke-width="3" fill="none"/><text x="400" y="18" font-size="17" text-anchor="middle" fill="#203c5d">${esc(title)}</text><text x="400" y="266" font-size="13" text-anchor="middle" fill="#203c5d">${esc(xLabel||txt('intensity'))} ${xLabel?'':'(0–150%)'}</text><text x="750" y="22" font-size="12" text-anchor="end" fill="#526582">${esc(yUnit)}</text>`;return svg(out,800,280)}function render(){if(!data)return;const d=data,t=dict[lang];$('cards').innerHTML=card(t.total,d.total===null?'≥ 100% load':d.total.toFixed(3)+' ms')+card(t.throughput,d.bottleneck.toFixed(2)+' Mbps')+card(t.loss,d.sim.loss.toFixed(2)+'%')+card(t.bottleneck,d.bottleneck+' Mbps');$('topologyChart').innerHTML=topology();$('delayHead').innerHTML='<tr>'+[t.hop,t.rate,t.tx,t.prop,t.proc,t.queue,t.sum].map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>';$('delayRows').innerHTML=d.per.map((p,i)=>'<tr>'+[i+1,p.rate+' Mbps',p.tx.toFixed(3),p.prop.toFixed(3),p.proc.toFixed(3),p.queue===null?'—':p.queue.toFixed(3),p.queue===null?'—':(p.tx+p.prop+p.proc+p.queue).toFixed(3)].map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>').join('');$('delayChart').innerHTML=bars([t.tx,t.prop,t.proc,t.queue],[d.per.reduce((s,x)=>s+x.tx,0),d.per.reduce((s,x)=>s+x.prop,0),1,d.total===null?0:2*d.per[0].queue]);$('packetStats').innerHTML=`<span>${esc(t.arrivals)}: <b>${d.sim.arr}</b></span><span>${esc(t.dropped)}: <b>${d.sim.drop}</b></span><span>${esc(t.delivered)}: <b>${d.sim.arr-d.sim.drop}</b></span><span>${esc(t.loss)}: <b>${d.sim.loss.toFixed(2)}%</b></span>`;const sample=d.sim.h.filter((_,i)=>i%12===0),max=Math.max(d.v.buffer,1);$('packetsChart').innerHTML=curve(t.occupancy,sample,max,t.occupancy,t.time);const intensities=Array.from({length:31},(_,i)=>i*.05);const losses=intensities.map((x,i)=>queueSim(x,d.v.buffer,100+i,1600).loss);const delays=intensities.map(x=>x>=.98?Math.min(1000,d.fixed+2*(queueMs(.98,d.bottleneck,d.v.packet)||0)):d.fixed+2*queueMs(x,d.bottleneck,d.v.packet));$('lossCurve').innerHTML=curve(t.lossAxis,losses,Math.max(10,...losses),t.lossAxis);$('delayCurve').innerHTML=curve(t.delayAxis,delays,Math.max(10,...delays),t.delayAxis);$('compareCards').innerHTML=card(t.circuit,d.circuit+' '+t.supported)+card(t.packetSwitch,d.packet+' '+t.supported)+card(t.requested,d.v.users);$('compareChart').innerHTML=bars([t.circuit,t.packetSwitch],[d.circuit,d.packet]);['topology','delay','packets','compare'].forEach(x=>$(x+'Section').classList.toggle('hidden',page!=='all'&&page!==x))}function translate(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(x=>x.textContent=txt(x.dataset.i));$('lang').textContent=lang==='ar'?'English 🌍':'العربية 🌍';render()}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));render()}));$('lang').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';translate()});$('run').addEventListener('click',calc);$('reset').addEventListener('click',()=>{Object.entries({packet:1500,link1:10,link2:2,link3:100,distance:1000,traffic:50,buffer:20,users:40,userRate:.1}).forEach(([k,v])=>$(k).value=v);$('trafficVal').textContent='50%';$('bufferVal').textContent='20';calc()});['traffic','buffer'].forEach(k=>$(k).addEventListener('input',()=>$(k+'Val').textContent=$(k).value+(k==='traffic'?'%':'')));translate();calc()})();
</script></body></html>
